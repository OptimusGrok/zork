<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607"><title>Zork</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050607;color:#cfc9b8;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;overflow:hidden}
#app{position:fixed;inset:0;background:#000}
#stage{position:absolute;inset:0;background:#000}
#cv{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 40%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;cursor:pointer}
#lookup{position:absolute;right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));z-index:2;background:rgba(10,12,14,.65);color:#d8d2c0;border:1px solid #444;border-radius:6px;font:inherit;font-size:12px;padding:7px 10px}
#mute{position:absolute;left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));z-index:2;background:rgba(10,12,14,.55);color:#aaa;border:1px solid #333;border-radius:6px;font:inherit;font-size:12px;padding:7px 9px}
#ui{position:absolute;left:0;right:0;bottom:0;max-height:62%;display:flex;flex-direction:column;background:linear-gradient(to bottom,rgba(5,6,7,0) 0,rgba(5,6,7,.72) 34px,rgba(5,6,7,.9) 100%);padding-top:26px;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);pointer-events:none}
#ui *{pointer-events:none}#ui button,#ui #txt{pointer-events:auto}
#ui>*{width:100%;max-width:760px;margin:0 auto}
#bar{flex:none;display:flex;gap:6px;align-items:center;padding:6px 10px;min-height:42px;flex-wrap:wrap;font-size:12px;color:#7d7a70}
#inv{display:flex;gap:6px;flex-wrap:wrap;flex:1;align-items:center}
.item{background:rgba(19,20,22,.85);color:#cfc9b8;border:1px solid #3a3a3a;border-radius:5px;font:inherit;font-size:12px;padding:6px 9px}
.item.sel{border-color:#d2ad4c;color:#f0d886;box-shadow:0 0 8px rgba(210,173,76,.35)}
#jb{background:none;border:1px solid #333;color:#aaa;border-radius:5px;font:inherit;font-size:12px;padding:6px 9px}
#txt{flex:0 1 auto;min-height:3em;overflow:auto;padding:6px 18px;text-shadow:0 1px 3px #000;font-size:15px;line-height:1.6;white-space:pre-wrap;transition:color 2s}
#ch{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 10px calc(12px + env(safe-area-inset-bottom));min-height:10px}
.c{min-height:44px;background:rgba(17,18,20,.86);color:#ddd6c4;border:1px solid #34353a;border-radius:7px;font:inherit;font-size:14px;padding:8px;animation:fi .35s ease both}
.c:active{background:#1d1e22}.c.w{grid-column:1/3}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.ov{position:fixed;inset:0;background:rgba(3,4,5,.88);display:flex;align-items:center;justify-content:center;z-index:5}
.card{max-width:420px;width:88%;border:1px solid #333;background:#0b0c0e;padding:22px;border-radius:10px;text-align:center}
.card h1{letter-spacing:.5em;font-weight:400;margin:6px 0 4px;font-size:34px;color:#e6e0cf}
.card h2{font-weight:400;letter-spacing:.2em;color:#d9c48a;font-size:18px}
.card p{color:#a9a597;font-size:14px;line-height:1.6;text-align:left;white-space:pre-wrap}
.card .c{width:100%;margin-top:10px}
#eb{background:#d8c48a!important;color:#120d06!important;border:2px solid #f3e2b0!important;font-weight:700;font-size:17px;min-height:52px;animation:none!important;opacity:1!important;box-shadow:0 0 20px rgba(243,226,176,.45);position:relative;z-index:5}
#jl{text-align:left;font-size:13px;color:#bdb8a8;line-height:1.6;max-height:50vh;overflow:auto}
.hidden{display:none!important}
@media (orientation:landscape) and (max-height:500px){#ui{max-height:70%;padding-top:16px}#txt{font-size:14px;line-height:1.45;padding:4px 18px}#ch{grid-template-columns:repeat(3,1fr);gap:6px;padding-top:4px}.c{min-height:38px;font-size:13px;padding:5px}.c.w{grid-column:auto}#bar{min-height:34px;padding:3px 10px}}
@media (min-width:900px){#ch{grid-template-columns:repeat(3,1fr)}.c.w{grid-column:auto}}

</div>
<div id="title" class="ov"><div class="card"><h1>ZORK</h1><div style="color:#77736a;font-size:12px">a yard. a fence. a white house.</div><p style="text-align:center">Headphones recommended.</p><div id="tb"></div><div id="tend" style="font-size:12px;color:#6d6a61;margin-top:12px"></div></div></div>

<div id="ending" class="ov hidden"><div class="card"><div style="font-size:12px;color:#77736a">ENDING</div><h2 id="et"></h2><p id="ep"></p><div id="es" style="color:#d9c48a;font-size:14px"></div><div id="ee" style="color:#77736a;font-size:12px;margin-top:6px"></div><button class="c" id="eb">Play again</button></div></div>

function openObj(id){const o=OBJ[id];if(id==='mailbox'){if(G.view!=='mailbox')return go('mailbox',act(G.f.mbOpen?"The mailbox, its door hanging open.":"The mailbox leans on a split post, rusted the color of dried blood. Dented, as if something kicked it, or pushed out from inside. A faded 13 on the side.",0),OBJ.mailbox.ch());return present("The mailbox.",o.ch())}

 if(k==='remember')t="You hold up the photograph. It turns.\n\nIt has your face, older and very tired. It looks at the photo for a long time, then at you, and remembers.\n\nIt takes your hand. Its fingers are cold, then warm. Downstairs, the clock starts ticking. When you look back at the window, there is nobody in it at all. For the first time, the house is empty.";
 if(k==='tenant')t=(how==='bed'?"You lie down, just for a moment. The mattress is soft and smells of someone you used to be.\n\n":how==='touch'?"You touch its shoulder. It turns around, and it is you, and you are it, and you're the one standing at the window now.\n\n":"You stand on the worn pale boards in front of the glass. It feels right. It feels like yours.\n\n")+"Down in the yard, someone wakes up in the dead grass and looks around. Eventually they'll look up.\n\nYou'll be ready.";
 A.sting();vib([100,50,200]);const ef=endingsFound();if(!ef.includes(k)){ef.push(k);try{localStorage.setItem('zork-endings',JSON.stringify(ef))}catch(e){}}
